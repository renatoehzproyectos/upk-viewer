<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UDK 3D Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; color: #e6e8ef; font-family: -apple-system,Segoe UI,Roboto,sans-serif; overflow: hidden; }
  #panel {
    position: absolute; top: 0; left: 0; z-index: 10; width: 320px; max-height: 100%;
    overflow-y: auto; background: rgba(15,17,21,0.92); border-right: 1px solid #262b38;
    padding: 16px; box-sizing: border-box; font-size: 13px;
  }
  #panel h1 { font-size: 15px; margin: 0 0 4px; }
  #panel p.sub { color: #8b90a3; margin: 0 0 16px; }
  #panel a { color: #6ea8fe; }
  .drop {
    border: 2px dashed #262b38; border-radius: 8px; padding: 20px 12px; text-align: center;
    color: #8b90a3; cursor: pointer; margin-bottom: 12px;
  }
  .drop.drag { border-color: #6ea8fe; color: #e6e8ef; }
  input[type=file] { display: none; }
  button {
    background: #161922; border: 1px solid #262b38; color: #e6e8ef; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 12px; width: 100%;
  }
  button:hover { border-color: #6ea8fe; }
  #log { white-space: pre-wrap; color: #8b90a3; font-size: 11px; margin-top: 10px; line-height: 1.5; }
  #log .err { color: #f28787; }
  #log .ok { color: #7fd996; }
  .mesh-item {
    padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between;
  }
  .mesh-item:hover { background: #161922; }
  .mesh-item .idx { color: #8b90a3; font-size: 11px; }
  canvas { display: block; }

  #app-version {
    position: fixed; top: 10px; right: 12px; z-index: 100;
    font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #e6e8ef; opacity: 0.5; pointer-events: none;
    user-select: none; letter-spacing: 0.02em;
  }
  button.secondary { margin-top: 8px; opacity: 0.9; }
  .mesh-item.active { background: #1a2233; border: 1px solid #2a3550; }
  #progress { color: #8b90a3; font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div id="app-version">v__APP_VERSION__</div>
<div id="panel">
  <h1>UDK 3D Viewer</h1>
  <p class="sub">Preview de mapas workshop (Rocket League / UDK) — todos los StaticMesh en la escena. <a href="../">Visor de estructura (header)</a></p>

  <div class="drop" id="drop">
    Arrastra uno o más .udk/.upk aquí<br />(el archivo que contiene el StaticMesh, y opcionalmente los que referencia)
    <input type="file" id="fileInput" multiple accept=".udk,.upk,.u,.umap" />
  </div>
  <button id="btnPick">Elegir archivo(s)</button>
  <button id="btnLoadAll" class="secondary" disabled>Cargar mapa completo (todos los meshes)</button>
  <div id="progress"></div>
  <button id="btnDbg" class="secondary" type="button">Show decoder debug log</button>
  <pre id="dbgLog" style="display:none;font-size:10px;min-height:48px;max-height:220px;overflow:auto;color:#9ecbff;background:#0a0c10;padding:8px;border-radius:6px;margin-top:8px;white-space:pre-wrap;word-break:break-all;"></pre>
  <div id="meshList"></div>
  <div id="log"></div>
</div>
<script src="./pkg/udk_decoder.js?v=__APP_VERSION__"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const drop = document.getElementById("drop");
const fileInput = document.getElementById("fileInput");
const btnPick = document.getElementById("btnPick");
const meshListEl = document.getElementById("meshList");
const logEl = document.getElementById("log");

let Module = null;
let mainFilename = null;
let meshGroup = null;
let allMeshes = [];
let loadedCount = 0;

function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

// --- three.js scene setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100000);
camera.position.set(300, 200, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(500, 1000, 700);
scene.add(dirLight);
scene.add(new THREE.GridHelper(2000, 40, 0x333844, 0x1c1f28));

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

// --- WASM module init ---
UdkDecoderModule().then((mod) => {
  Module = mod;
  try {
    log(Module.decoder_version(), "ok");
  } catch (e) {
    log("WASM cargado, decoder_version falló: " + e, "err");
  }
}).catch((e) => {
  log("Error cargando el módulo WASM: " + e, "err");
});

// --- file handling ---
btnPick.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("drag");
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files.length) handleFiles(fileInput.files);
  fileInput.value = "";
});


function dumpDecoderDebug(tag) {
  const el = document.getElementById("dbgLog");
  if (!el) return;
  let text = tag ? ("=== " + tag + " ===\n") : "";
  try {
    if (!Module) {
      text += "(Module not loaded yet — wait for WASM)";
    } else if (typeof Module.get_debug_log !== "function") {
      text += "(get_debug_log missing — WASM is old or build failed.\n";
      text += "decoder_version: " + (typeof Module.decoder_version === "function" ? Module.decoder_version() : "?") + ")";
    } else {
      const lines = Module.get_debug_log() || [];
      if (!lines.length) {
        text += "(log empty — open a .udk first, then press again)";
      } else {
        text += lines.join("\n");
      }
    }
  } catch (e) {
    text += "(exception: " + (e && e.message ? e.message : e) + ")";
    console.warn("debug log failed", e);
  }
  el.textContent = text;
  el.style.display = "block";
  console.log("[decoder-debug]", text);
}
const btnDbg = document.getElementById("btnDbg");
if (btnDbg) {
  btnDbg.addEventListener("click", () => {
    const el = document.getElementById("dbgLog");
    if (!el) return;
    if (el.style.display === "none" || !el.textContent) {
      dumpDecoderDebug("manual");
    } else {
      el.style.display = "none";
    }
  });
}

async function handleFiles(fileList) {
  if (!Module) {
    log("El módulo WASM todavía no termina de cargar, espera un segundo e intenta de nuevo.", "err");
    return;
  }
  try {
    Module.FS.mkdir("/game");
  } catch (e) { /* already exists */ }

  let first = null;
  for (const file of fileList) {
    const buf = new Uint8Array(await file.arrayBuffer());
    Module.FS.writeFile("/game/" + file.name, buf);
    log(`Cargado: ${file.name} (${(buf.length / 1024).toFixed(1)} KB)`);
    if (!first) first = file.name;
  }
  mainFilename = first;

  const rc = Module.scan_and_open(mainFilename);
  if (rc !== 0) {
    log(`No se pudo abrir "${mainFilename}" (código ${rc}).`, "err");
    return;
  }
  log(`Paquete abierto: ${mainFilename}`, "ok");

  const exportsArr = Module.list_exports();
const meshes = exportsArr.filter((e) => e.className === "StaticMesh");
  allMeshes = meshes;
  loadedCount = 0;
  log(`${exportsArr.length} exports encontrados, ${meshes.length} StaticMesh.`);
  let texList = [];
  try { texList = Module.list_textures ? Module.list_textures() : []; } catch (e) {}
  log(`Texture2D en este paquete: ${texList.length}` + (texList.length ? " (Path C posible aquí)" : " (sin texturas embebidas / carga más .upk)"), texList.length ? "ok" : "err");
  dumpDecoderDebug("after list_exports");

  meshListEl.innerHTML = "";
  meshes.forEach((m) => {
    const div = document.createElement("div");
    div.className = "mesh-item";
    div.dataset.index = m.index;
    div.innerHTML = `<span>${m.objectName}</span><span class="idx">#${m.index}</span>`;
    div.addEventListener("click", () => {
      // highlight only — full map stays loaded
      document.querySelectorAll(".mesh-item").forEach((el) => el.classList.remove("active"));
      div.classList.add("active");
      focusMeshByName(m.objectName);
    });
    meshListEl.appendChild(div);
  });

  const btnAll = document.getElementById("btnLoadAll");
  if (btnAll) {
    btnAll.disabled = meshes.length === 0;
    btnAll.onclick = () => loadAllMeshes();
  }

  if (meshes.length === 0) {
    log("Este paquete no contiene StaticMesh exports (o son de un tipo que este visor aún no reconoce).", "err");
  } else {
    // Auto-load full map for workshop preview
    loadAllMeshes();
  }
}

function clearSceneMeshes() {
  if (meshGroup) {
    scene.remove(meshGroup);
    meshGroup.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose());
        else o.material.dispose();
      }
    });
  }
  meshGroup = new THREE.Group();
  scene.add(meshGroup);
}

function textureFromDiffuse(diffuse) {
  if (!diffuse || !diffuse.rgba || !diffuse.width || !diffuse.height) return null;
  const data = diffuse.rgba instanceof Uint8Array ? diffuse.rgba : new Uint8Array(diffuse.rgba);
  const tex = new THREE.DataTexture(data, diffuse.width, diffuse.height, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.needsUpdate = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.flipY = false; // UE UV origin
  return tex;
}

function meshFromData(data, name) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(data.positions), 3));
  geometry.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(data.normals), 3));
  geometry.setAttribute("uv", new THREE.BufferAttribute(new Float32Array(data.uvs), 2));
  geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(data.indices), 1));
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();

  const sections = data.sections || [];
  const materials = [];

  if (sections.length === 0) {
    materials.push(new THREE.MeshStandardMaterial({
      color: 0x8a9bb5, metalness: 0.1, roughness: 0.75, side: THREE.DoubleSide,
    }));
  } else {
    for (let s = 0; s < sections.length; s++) {
      const sec = sections[s];
      const map = textureFromDiffuse(sec.diffuse);
      let hash = 0;
      const mname = sec.materialName || name || "";
      for (let i = 0; i < mname.length; i++) hash = (hash * 31 + mname.charCodeAt(i)) | 0;
      const hue = ((hash % 360) + 360) % 360;
      const fallback = new THREE.Color().setHSL(hue / 360, 0.3, 0.5);
      materials.push(new THREE.MeshStandardMaterial({
        map: map || null,
        color: map ? 0xffffff : fallback,
        metalness: 0.08,
        roughness: 0.72,
        side: THREE.DoubleSide,
        transparent: !!(map),
        alphaTest: 0.05,
      }));
      // Group geometry by section material
      const start = sec.firstIndex;
      const count = sec.numFaces * 3;
      if (count > 0) geometry.addGroup(start, count, s);
    }
  }

  const mesh = new THREE.Mesh(geometry, materials.length === 1 ? materials[0] : materials);
  mesh.name = name;
  return mesh;
}

function fitCameraToObject(object) {
  const box = new THREE.Box3().setFromObject(object);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z, 1) * 0.6;
  controls.target.copy(center);
  camera.position.set(center.x + radius * 1.6, center.y + radius * 1.1, center.z + radius * 1.6);
  camera.near = Math.max(radius / 200, 0.05);
  camera.far = Math.max(radius * 50, 5000);
  camera.updateProjectionMatrix();
  controls.update();
}

function focusMeshByName(name) {
  if (!meshGroup) return;
  const obj = meshGroup.getObjectByName(name);
  if (!obj) return;
  fitCameraToObject(obj);
}

function loadAllMeshes() {
  if (!Module || !allMeshes.length) return;
  clearSceneMeshes();
  const progressEl = document.getElementById("progress");
  let ok = 0, fail = 0;
  const total = allMeshes.length;

  // Yield to UI every few meshes so the page stays responsive
  let i = 0;
  function step() {
    const batch = 4;
    for (let n = 0; n < batch && i < total; n++, i++) {
      const m = allMeshes[i];
      try {
        const data = Module.get_static_mesh(m.index);
        if (!data || data.error) {
          fail++;
        } else {
          const mesh = meshFromData(data, m.objectName);
          meshGroup.add(mesh);
          ok++;
        }
      } catch (e) {
        fail++;
      }
      if (progressEl) progressEl.textContent = `Cargando mapa… ${i}/${total} (${ok} ok, ${fail} fallos)`;
    }
    if (i < total) {
      requestAnimationFrame(step);
    } else {
      if (progressEl) progressEl.textContent = `Mapa: ${ok}/${total} meshes en escena` + (fail ? ` (${fail} sin geometría)` : "");
      log(`Mapa completo: ${ok} meshes visibles` + (fail ? `, ${fail} omitidos` : "") + ".", ok ? "ok" : "err");
      dumpDecoderDebug("after loadAllMeshes");
      fitCameraToObject(meshGroup);
    }
  }
  step();
}

function loadMesh(index, name) {
  const data = Module.get_static_mesh(index);
  if (!data || data.error) {
    log(`No se pudo extraer geometría de "${name}" (#${index}): ${data ? data.error : "respuesta vacía"}`, "err");
    return;
  }

  // Single-mesh mode: replace scene contents with just this one
  clearSceneMeshes();
  const mesh = meshFromData(data, name);
  meshGroup.add(mesh);
  fitCameraToObject(mesh);
  log(`"${name}": ${data.vertexCount} vértices, ${data.indexCount / 3} triángulos.`, "ok");
}

</script>
</body>
</html>

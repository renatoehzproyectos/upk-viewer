<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UDK 3D Viewer (preview)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; color: #e6e8ef; font-family: sans-serif; overflow: hidden; }
  #info {
    position: absolute; top: 12px; left: 16px; z-index: 10;
    font-size: 13px; color: #8b90a3; max-width: 380px; line-height: 1.4;
  }
  #info a { color: #6ea8fe; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">
  <strong>UDK 3D Viewer — preview</strong><br />
  Escena de prueba (aún no conectada al decodificador WASM).
  Ver <a href="../">visor de estructura (header)</a>.
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(4, 3, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const grid = new THREE.GridHelper(20, 20, 0x333844, 0x1c1f28);
scene.add(grid);

// Placeholder geometry - stands in for a real StaticMesh export from the
// WASM decoder once that API exists.
const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
const material = new THREE.MeshStandardMaterial({ color: 0x6ea8fe, metalness: 0.2, roughness: 0.6 });
const cube = new THREE.Mesh(geometry, material);
cube.position.y = 0.75;
scene.add(cube);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  cube.rotation.y += 0.005;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

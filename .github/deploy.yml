name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          if [ -d www ]; then cp -r www/* _site/; fi
          mkdir -p _site/viewer3d
          cp -r viewer3d/web/* _site/viewer3d/
          if [ ! -f _site/index.html ]; then
            cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8" />
          <meta http-equiv="refresh" content="0; url=./viewer3d/" />
          <title>upk-viewer</title></head>
          <body><p><a href="./viewer3d/">Ir al visor 3D</a></p></body></html>
          HTML
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

name: Build and deploy UPK viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Header/structure viewer (Rust -> wasm) ---
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upk-wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm package (header viewer)
        working-directory: upk-wasm
        run: wasm-pack build --release --target web --out-dir ../www/pkg

      # --- 3D viewer (C++ subset of UEViewer -> wasm via Emscripten) ---
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Configure decoder (emcmake)
        working-directory: viewer3d/decoder
        run: |
          set -o pipefail
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      - name: Show CMake error log on configure failure
        if: failure()
        working-directory: viewer3d/decoder
        run: |
          echo "--- CMakeFiles/CMakeError.log (if any) ---"
          find build -name CMakeError.log -exec cat {} \; || true
          echo "--- CMakeFiles/CMakeOutput.log (if any) ---"
          find build -name CMakeOutput.log -exec cat {} \; || true

      - name: Build decoder (emmake)
        working-directory: viewer3d/decoder
        run: |
          set -o pipefail
          emmake cmake --build build -j$(nproc) 2>&1 | tee build.log

      - name: Upload decoder build logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoder-build-logs
          path: |
            viewer3d/decoder/configure.log
            viewer3d/decoder/build.log
          if-no-files-found: ignore

      - name: Copy decoder output into viewer3d/web/pkg
        run: |
          mkdir -p viewer3d/web/pkg
          cp viewer3d/decoder/build/udk_decoder.js viewer3d/web/pkg/
          cp viewer3d/decoder/build/udk_decoder.wasm viewer3d/web/pkg/

      # --- Assemble & publish both pages ---

      - name: Stamp version into site (cache-bust + badge)
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          BUILD=$(date -u +%Y%m%d%H%M%S)
          STAMP="${VERSION}+${BUILD}"
          echo "Stamping version ${STAMP}"
          # Replace placeholders in HTML
          for f in viewer3d/web/index.html www/index.html; do
            if [ -f "$f" ]; then
              sed -i "s/__APP_VERSION__/${STAMP}/g" "$f"
            fi
          done
          # Cache-bust wasm-pack assets referenced from main.js if present
          if [ -f www/main.js ]; then
            sed -i "s|./pkg/|./pkg/?v=${STAMP}&path=|g" www/main.js 2>/dev/null || true
            # Prefer simple query on known imports
            sed -i "s|upk_wasm.js|upk_wasm.js?v=${STAMP}|g" www/main.js || true
          fi
          # version.json for clients that poll
          mkdir -p viewer3d/web www
          printf '{"version":"%s","build":"%s"}\n' "$VERSION" "$BUILD" > viewer3d/web/version.json
          cp viewer3d/web/version.json www/version.json
          # Copy VERSION into site root for humans
          cp VERSION _site_version_tmp 2>/dev/null || true
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "STAMP=${STAMP}" >> $GITHUB_ENV

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r www/* _site/
          mkdir -p _site/viewer3d
          cp -r viewer3d/web/* _site/viewer3d/
          # Ensure version badge placeholders never ship unreplaced
          find _site -name '*.html' -print0 | xargs -0 sed -i "s/__APP_VERSION__/${STAMP}/g"
          echo "${STAMP}" > _site/VERSION
          # GitHub Pages serves with CDN; HTML with no-cache meta + unique ?v= query on assets
          # forces browsers to fetch new JS/WASM after each deploy.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
